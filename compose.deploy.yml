services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traceguard}
      POSTGRES_USER: ${POSTGRES_USER:-traceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - deployment-db:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-traceguard}
      POSTGRES_USER: ${POSTGRES_USER:-traceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TRACEGUARD_JWT_SECRET: ${TRACEGUARD_JWT_SECRET:?Set TRACEGUARD_JWT_SECRET}
      TRACEGUARD_ADMIN_EMAIL: ${TRACEGUARD_ADMIN_EMAIL:?Set TRACEGUARD_ADMIN_EMAIL}
      TRACEGUARD_ADMIN_PASSWORD: ${TRACEGUARD_ADMIN_PASSWORD:?Set TRACEGUARD_ADMIN_PASSWORD}
      TRACEGUARD_KEYSTORE_DIR: /app/keystore
    volumes:
      - deployment-keys:/app/keystore

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${TRACEGUARD_HTTP_PORT:-8080}:80"

volumes:
  deployment-db:
  deployment-keys:
